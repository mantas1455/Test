<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0E6B52">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ShineQuote">
<title>ShineQuote — quotes that win jobs</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E✨%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#14171A;--glass:rgba(255,255,255,.11);--wline:rgba(255,255,255,.22);--wt:rgba(255,255,255,.8);--wt2:rgba(255,255,255,.55);--acc:#0E6B52;--accL:#57D6A4;--gold:#E9C46A;--bad:#FF8A7A;--info:#7FC0F5;--serif:'Fraunces',Georgia,'Times New Roman',serif;--b1:#1B8A6B;--b2:#0A5340}
  *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
  body{background:var(--brand,#0E6B52);color:#fff;max-width:560px;margin:0 auto;padding:16px 18px 170px;font-size:16px;transition:background .55s ease;position:relative;min-height:100vh}
  #bgfx{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
  #bgfx .blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;transition:background 1.2s ease}
  #bgfx .b1{width:75vmax;height:75vmax;left:-28vmax;top:-32vmax;background:var(--b1);animation:dr1 22s ease-in-out infinite alternate}
  #bgfx .b2{width:62vmax;height:62vmax;right:-26vmax;bottom:-26vmax;background:var(--b2);animation:dr2 27s ease-in-out infinite alternate}
  @keyframes dr1{to{transform:translate(7vmax,5vmax) scale(1.09)}}
  @keyframes dr2{to{transform:translate(-6vmax,-7vmax) scale(1.12)}}
  #bgfx span{position:absolute;border-radius:50%;background:rgba(255,255,255,.32);bottom:-6vh;animation:rise linear infinite}
  @keyframes rise{from{transform:translateY(0)}to{transform:translateY(-118vh)}}
  body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 90% 55% at 50% 8%,rgba(255,255,255,.14),transparent 62%);pointer-events:none;z-index:0}
  main,header,footer,.nextbar,.tabbar{position:relative;z-index:1}
  button,input,select{font-family:inherit}
  button{cursor:pointer;transition:transform .35s cubic-bezier(.34,1.56,.64,1),background .2s,color .2s,opacity .2s,border-color .2s}
  .pressable:active{transform:scale(.955)}
  .icb{display:inline-flex;align-items:center;justify-content:center;gap:7px}
  header{display:flex;justify-content:space-between;align-items:center;padding:6px 2px}
  h1{font-family:var(--serif);font-size:1.15rem;font-weight:600;letter-spacing:-.01em;display:flex;align-items:center;gap:7px}
  .hact{background:none;border:none;color:var(--wt);font-size:.84rem;padding:8px 2px}
  main section{animation:fadein .2s ease}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  .af{animation:slideF .32s cubic-bezier(.22,.9,.3,1)}
  .ab{animation:slideB .32s cubic-bezier(.22,.9,.3,1)}
  @keyframes slideF{from{opacity:0;transform:translateX(34px)}to{opacity:1;transform:none}}
  @keyframes slideB{from{opacity:0;transform:translateX(-34px)}to{opacity:1;transform:none}}
  .stin{animation:stin .5s cubic-bezier(.22,.9,.3,1) both}
  @keyframes stin{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
  .q{font-family:var(--serif);font-weight:600;font-size:2rem;line-height:1.12;letter-spacing:-.02em;margin:18px 2px 7px;text-shadow:0 1px 14px rgba(0,0,0,.14)}
  .qsub{font-size:.92rem;color:var(--wt);margin:0 2px 20px;line-height:1.5}
  .prog{height:4px;background:rgba(255,255,255,.25);border-radius:99px;margin:14px 2px 0;overflow:hidden}
  .prog i{display:block;height:100%;background:#fff;border-radius:99px;transition:width .4s cubic-bezier(.22,.9,.3,1)}
  .backrow{display:flex;justify-content:space-between;align-items:center}
  .backln{background:none;border:none;color:var(--wt);font-size:.92rem;padding:10px 2px 0}
  .cnt2{font-size:.78rem;color:var(--wt2);padding-top:10px;font-variant-numeric:tabular-nums}
  .onb{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--glass);border:1px solid var(--wline);border-radius:15px;padding:12px 14px;margin-top:14px;font-size:.84rem;color:var(--wt);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  .onb b{color:#fff;font-weight:600}
  .onb button{background:#fff;border:none;color:var(--brand);font-weight:700;border-radius:99px;padding:8px 14px;font-size:.78rem;flex:none}
  .onb .x{background:none;border:none;color:var(--wt2);font-size:.95rem;padding:6px}
  .vgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .vtile{position:relative;overflow:hidden;background:var(--glass);border:1.5px solid var(--wline);border-radius:22px;padding:24px 12px 18px;text-align:center;color:#fff;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  .vtile .vi{display:flex;justify-content:center;margin-bottom:10px}
  .vtile b{font-size:1.05rem;font-weight:650;display:block}
  .vtile span{display:block;font-size:.74rem;color:var(--wt2);margin-top:3px}
  .vtile.on{background:#fff;color:var(--brand);border-color:#fff;box-shadow:0 12px 30px rgba(0,0,0,.22)}
  .vtile.on span{color:rgba(0,0,0,.5)}
  .olist{display:flex;flex-direction:column;gap:10px}
  .orow{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;background:var(--glass);border:1.5px solid var(--wline);border-radius:19px;padding:17px 16px;color:#fff;text-align:left;width:100%;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  .orow.on{background:#fff;color:var(--brand);border-color:#fff;box-shadow:0 12px 30px rgba(0,0,0,.22)}
  .orow .oi{flex:none;width:36px;display:flex;justify-content:center}
  .orow .ot b{display:block;font-size:1.02rem;font-weight:650;letter-spacing:-.01em}
  .orow .ot i{display:block;font-size:.79rem;color:var(--wt2);font-style:normal;margin-top:3px;line-height:1.4}
  .orow.on .ot i{color:rgba(0,0,0,.5)}
  .orow .op{margin-left:auto;font-weight:700;flex:none;font-variant-numeric:tabular-nums}
  .orow.on .op{color:var(--brand)}
  .tick{margin-left:6px;font-weight:800;flex:none;opacity:0;transform:scale(.4);transition:.25s cubic-bezier(.34,1.56,.64,1);display:flex}
  .orow.on .tick{opacity:1;transform:scale(1)}
  .plus{margin-left:6px;font-weight:700;flex:none;color:var(--wt);display:flex}
  .orow.on .plus{display:none}
  .pulse{animation:selPulse .4s cubic-bezier(.34,1.56,.64,1)}
  @keyframes selPulse{0%{transform:scale(1)}40%{transform:scale(1.03)}100%{transform:scale(1)}}
  .rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);transform:scale(0);animation:rip .55s ease-out forwards;pointer-events:none}
  .rip.dark{background:rgba(0,0,0,.09)}
  @keyframes rip{to{transform:scale(1);opacity:0}}
  .nextbar{position:fixed;left:0;right:0;bottom:calc(70px + env(safe-area-inset-bottom));z-index:11;padding:10px 18px 6px;background:linear-gradient(180deg,transparent,rgba(0,0,0,.14))}
  .nextbar[hidden]{display:none}
  .nextbtn{position:relative;overflow:hidden;width:100%;min-height:58px;border:none;border-radius:19px;background:#fff;font-size:1.06rem;font-weight:750;box-shadow:0 10px 28px rgba(0,0,0,.28);display:flex;justify-content:center;align-items:center;gap:8px;color:var(--brand);font-variant-numeric:tabular-nums}
  .nextbtn:disabled{opacity:.4;box-shadow:none}
  .nextbtn.bump{animation:bump .4s cubic-bezier(.34,1.56,.64,1)}
  @keyframes bump{0%{transform:scale(1)}45%{transform:scale(1.045)}100%{transform:scale(1)}}
  .receipt{background:#fff;color:var(--ink);border-radius:24px;box-shadow:0 18px 44px rgba(0,0,0,.3);padding:24px 20px;margin-top:8px;animation:recpop .45s cubic-bezier(.34,1.4,.64,1)}
  @keyframes recpop{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
  .rz{border-bottom:2px dashed #E8E4DC;margin:14px -20px;padding:0 20px 14px}
  .rhead{text-align:center}
  .rhead .biz{font-family:var(--serif);font-size:1.15rem;font-weight:700}
  .rhead .for{font-size:.8rem;color:#7A7F84;margin-top:3px}
  .ritem{display:flex;justify-content:space-between;gap:10px;font-size:.94rem;padding:7px 0}
  .ritem i{color:#9AA0A6;font-style:normal;font-size:.76rem;display:block;margin-top:1px}
  .ritem b{font-weight:650;flex:none;font-variant-numeric:tabular-nums}
  .rtot{display:flex;justify-content:space-between;align-items:baseline;border-top:2px dashed #E8E4DC;margin:12px -20px 0;padding:14px 20px 0}
  .rtot .tl{font-size:.72rem;text-transform:uppercase;letter-spacing:.15em;color:#7A7F84}
  .rtot b{font-family:var(--serif);font-size:2.2rem;font-weight:700;color:var(--acc);font-variant-numeric:tabular-nums}
  .rdep{font-size:.8rem;color:#7A7F84;text-align:center;margin-top:10px}
  .rdep b{color:var(--acc);font-variant-numeric:tabular-nums}
  .rcta{font-size:.8rem;color:#7A7F84;text-align:center;margin-top:12px;line-height:1.5}
  .rbtns{display:flex;gap:10px;margin-top:18px}
  .rbtns .ghost{flex:1;min-height:54px;border-radius:16px;border:1.5px solid #E8E4DC;background:#fff;color:var(--ink);font-size:.95rem;font-weight:650}
  .rbtns .go{position:relative;overflow:hidden;flex:1.6;min-height:54px;border:none;border-radius:16px;background:var(--ink);color:#fff;font-size:1rem;font-weight:700}
  .startover{display:block;margin:14px auto 0;background:none;border:none;color:var(--wt);font-size:.86rem;text-decoration:underline}
  .inp{width:100%;background:var(--glass);border:1.5px solid var(--wline);color:#fff;border-radius:16px;padding:15px;font-size:16px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  .inp::placeholder{color:var(--wt2)}
  .inp:focus{outline:1.5px solid #fff}
  .lbl2{font-size:.8rem;color:var(--wt);margin:18px 2px 8px;display:block}
  .stepper{display:flex;align-items:center;gap:4px;background:var(--glass);border:1.5px solid var(--wline);border-radius:17px;padding:6px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  .stepper button{width:50px;height:46px;border:none;border-radius:13px;background:rgba(255,255,255,.2);color:#fff;font-size:1.35rem}
  .stepper b{flex:1;text-align:center;font-size:1.05rem;font-variant-numeric:tabular-nums}
  .hint{display:block;font-size:.75rem;color:var(--wt2);margin-top:8px;line-height:1.5}
  .tabbar{position:fixed;bottom:0;left:0;right:0;display:flex;gap:6px;background:rgba(10,12,14,.4);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid rgba(255,255,255,.14);padding:8px 14px calc(8px + env(safe-area-inset-bottom));z-index:10}
  .tab{flex:1;position:relative;overflow:hidden;background:none;border:none;color:var(--wt2);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.67rem;padding:7px 0 5px;min-height:54px;border-radius:999px}
  .tab .ti{display:flex}
  .tab.on{background:#fff;color:var(--ink);font-weight:700}
  .tab.on .ti{animation:tabpop .4s cubic-bezier(.34,1.56,.64,1)}
  @keyframes tabpop{0%{transform:scale(.6)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
  .qline{font-size:.94rem;color:var(--wt);margin:16px 2px 0;line-height:1.6}
  .qline b{color:var(--accL);font-weight:700;font-variant-numeric:tabular-nums}
  .fseg{display:flex;background:var(--glass);border:1.5px solid var(--wline);border-radius:15px;padding:3px;gap:3px;margin-top:16px}
  .fseg button{flex:1;border:none;background:none;color:var(--wt);padding:11px 0;border-radius:12px;font-size:.86rem;min-height:44px;font-variant-numeric:tabular-nums}
  .fseg button.on{background:#fff;color:var(--ink);font-weight:700}
  .ahs{display:flex;justify-content:space-between;align-items:center;gap:10px;background:rgba(233,196,106,.14);border:1px solid rgba(233,196,106,.35);border-radius:15px;padding:12px 14px;margin-top:14px;font-size:.82rem;color:var(--gold)}
  .ahs button{background:none;border:1px solid rgba(233,196,106,.5);color:var(--gold);font-weight:700;border-radius:99px;padding:7px 13px;font-size:.76rem;flex:none}
  .qcard{background:var(--glass);border:1.5px solid var(--wline);border-radius:19px;padding:15px 16px;margin-top:10px;cursor:pointer;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  .qcard .r1{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .qcard .nm{font-weight:650;font-size:.98rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .qcard .amt{font-weight:750;color:#fff;flex:none;font-variant-numeric:tabular-nums}
  .qcard .r2{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:5px}
  .qcard .sub{font-size:.76rem;color:var(--wt2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stat{border-radius:99px;padding:4px 11px;font-size:.71rem;font-weight:700;flex:none}
  .st-sent{color:var(--info);background:rgba(127,192,245,.15)}
  .st-booked{color:var(--gold);background:rgba(233,196,106,.15)}
  .st-done{color:var(--accL);background:rgba(87,214,164,.14)}
  .odot{color:var(--gold);display:flex}
  .logdone{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:12px;background:none;border:1.5px dashed var(--wline);border-radius:16px;color:var(--wt);font-size:.9rem;padding:15px}
  .bkm{font-size:.78rem;color:var(--wt);margin:16px 2px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .bkm button{background:none;border:none;color:#fff;font-size:.78rem;font-weight:700;text-decoration:underline;padding:6px 0}
  .bkm,.ahs{align-items:center}
  .bkm span,.ahs span{display:flex;align-items:center;gap:7px}
  .empty{color:var(--wt2);font-size:.92rem;padding:40px 0;text-align:center;line-height:1.7}
  .empty svg{display:block;margin:0 auto 8px;opacity:.7}
  .acc{border-bottom:1px solid rgba(255,255,255,.14)}
  .acc-h{width:100%;display:flex;justify-content:space-between;align-items:center;background:none;border:none;color:#fff;padding:18px 2px;font-size:1rem;font-weight:650;min-height:58px;text-align:left}
  .acc-h .val{font-size:.8rem;color:var(--wt2);font-weight:450;margin-left:8px}
  .acc-h i{color:var(--wt2);font-style:normal;font-size:.8rem;flex:none;margin-left:8px;transition:transform .25s}
  .acc.open .acc-h i{display:inline-block;transform:rotate(180deg)}
  .acc-b{display:none;padding:2px 2px 20px;animation:fadein .18s ease}
  .acc.open .acc-b{display:block}
  .field{display:block;font-size:.8rem;color:var(--wt);margin-bottom:13px;line-height:1.4}
  .field input,.field select{display:block;width:100%;margin-top:6px;background:var(--glass);border:1.5px solid var(--wline);color:#fff;border-radius:14px;padding:13px;font-size:16px}
  .field input::placeholder{color:var(--wt2)}
  input:focus,select:focus{outline:1.5px solid #fff}
  .check{display:flex;gap:11px;align-items:center;font-size:.92rem;margin:14px 0;min-height:40px;color:#fff}
  .sw{position:relative;width:46px;height:28px;flex:none}
  .sw input{position:absolute;inset:0;opacity:0;margin:0;width:100%;height:100%;cursor:pointer}
  .sw i{display:block;height:100%;border-radius:99px;background:rgba(255,255,255,.2);transition:.15s;pointer-events:none;position:relative}
  .sw i::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s}
  .sw input:checked+i{background:#fff}
  .sw input:checked+i::after{left:21px;background:var(--brand)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .textbtn{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--glass);border:1.5px solid var(--wline);color:#fff;padding:14px 16px;border-radius:15px;font-size:.88rem;font-weight:600;margin-top:10px;width:100%;min-height:50px}
  .mrow{display:flex;align-items:center;gap:12px;padding:14px 2px;border-bottom:1px solid rgba(255,255,255,.12);cursor:pointer}
  .mrow:last-of-type{border-bottom:none}
  .mrow.off{opacity:.45}
  .mrow .si{flex:none;width:30px;display:flex;justify-content:center}
  .mrow .mn{flex:1;min-width:0}
  .mrow .mn b{display:block;font-size:.95rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mrow .mn i{display:block;font-size:.7rem;color:var(--wt2);font-style:normal;margin-top:2px}
  .mrow .mp{font-weight:700;font-size:.95rem;flex:none;font-variant-numeric:tabular-nums}
  .mrow .mv{display:flex;flex-direction:column;gap:1px;flex:none}
  .mvb{background:transparent;border:none;color:var(--wt2);min-width:30px;min-height:22px;font-size:.7rem;padding:0}
  .mvb:disabled{opacity:.25}
  .overlay{position:fixed;inset:0;background:rgba(8,10,12,.55);z-index:30;display:flex;align-items:flex-end;justify-content:center;animation:fadein .15s ease}
  .overlay[hidden]{display:none}
  .sheet{width:100%;max-width:560px;max-height:92vh;overflow-y:auto;background:#1B1F24;border-radius:26px 26px 0 0;padding:10px 20px calc(22px + env(safe-area-inset-bottom));animation:slideup .25s cubic-bezier(.22,.9,.3,1)}
  @keyframes slideup{from{transform:translateY(46px);opacity:.5}to{transform:none;opacity:1}}
  .grab{width:40px;height:4px;border-radius:99px;background:rgba(255,255,255,.25);margin:4px auto 14px}
  .shq{font-family:var(--serif);font-weight:600;font-size:1.4rem;margin:4px 2px 12px;letter-spacing:-.02em}
  .emojirow{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
  .eb{position:relative;overflow:hidden;width:42px;height:42px;border-radius:13px;border:1.5px solid transparent;background:var(--glass);display:flex;align-items:center;justify-content:center;color:#fff}
  .eb.on{border-color:#fff;background:rgba(255,255,255,.22)}
  .stepnum{display:flex;gap:6px;margin-top:6px}
  .stepnum button{width:46px;min-height:46px;border-radius:13px;border:1.5px solid var(--wline);background:var(--glass);color:#fff;font-size:1.2rem;flex:none}
  .stepnum input{flex:1;width:100%;min-width:0;text-align:center;background:var(--glass);border:1.5px solid var(--wline);color:#fff;border-radius:13px;padding:12px;font-size:16px}
  .seg{display:flex;background:var(--glass);border:1.5px solid var(--wline);border-radius:15px;padding:3px;gap:3px}
  .seg button{flex:1;border:none;background:none;color:var(--wt);padding:11px 0;border-radius:12px;font-size:.86rem;min-height:44px}
  .seg button.on{background:#fff;color:var(--ink);font-weight:700}
  .btnrow{display:flex;gap:10px;margin-top:16px}
  .primary{position:relative;overflow:hidden;flex:1.5;min-height:52px;border:none;border-radius:16px;font-weight:750;background:#fff;color:var(--ink);font-size:.95rem}
  .ghost{flex:1;min-height:52px;border-radius:16px;border:1.5px solid var(--wline);background:var(--glass);color:#fff;font-size:.9rem}
  .qactions{display:flex;flex-direction:column;margin-top:10px}
  .qab{display:flex;align-items:center;background:none;border:none;color:#fff;font-size:.95rem;padding:14px 2px;border-bottom:1px solid rgba(255,255,255,.12);min-height:48px;text-align:left}
  .qab:last-child{border-bottom:none}
  .qab:active{transform:scale(.98)}
  .qab .ic{width:30px;display:inline-flex;justify-content:center;margin-right:12px}
  .qab.danger{color:var(--bad)}
  .qab .sub{font-size:.72rem;color:var(--wt2);margin-left:auto}
  .prevbox{background:#fff;color:var(--ink);border-radius:18px;padding:16px;font-size:.86rem;white-space:pre-wrap;line-height:1.6}

 if(q.status!=='done')acts+='<button class="qab" onclick="qaNudge()"><span class="ic">'+ic('bolt',19)+'</span>Send follow-up nudge<span class="sub">'+(q.nudges?('sent '+q.nudges+'×'):'polite, pre-written')+'</span></button>';
 acts+='<button class="qab" onclick="qaWa()"><span class="ic">'+ic('chat',19)+'</span>WhatsApp</button>'
  +'<button class="qab" onclick="qaSms()"><span class="ic">'+ic('phone',19)+'</span>Text message</button>'
  +'<button class="qab" onclick="qaCopy()"><span class="ic">'+ic('copy',19)+'</span>Copy message</button>'
  +'<button class="qab" onclick="qaReuse()"><span class="ic">'+ic('dup',19)+'</span>Build a similar quote</button>'
  +'<button class="qab" onclick="qaAdjust()"><span class="ic">'+ic('coin',19)+'</span>Adjust final price</button>'
  +'<button class="qab danger" onclick="qaDelete()"><span class="ic">'+ic('trash',19)+'</span>Delete</button>';
 $('#qActions').innerHTML=acts;
 openSheet('qOverlay');
}
function renderQStatus(st){
 $('#qStatusSeg').innerHTML=STATUSES.map(function(s){return '<button class="'+(s===st?'on':'')+'" onclick="qaStatus(\''+s+'\')">'+STATUS_LABEL[s]+'</button>'}).join('');
}
function qaStatus(st){
 const q=state.quotes.find(function(x){return x.id===openQuoteId});if(!q)return;
 q.status=st;save();buzz();renderQStatus(st);renderQuotes();
 if(st==='done'){burst(window.innerWidth/2,window.innerHeight*0.4);toast('Done — £'+fmtN(q.total)+' earned ✓')}
 else toast(st==='booked'?'Booked — congrats 🎉':'Marked awaiting reply');
}
function qaSend(){const q=state.quotes.find(function(x){return x.id===openQuoteId});if(q&&q.txt)nativeShare(q.txt,function(ok){if(!ok)window.open('https://wa.me/?text='+encodeURIComponent(q.txt),'_blank')})}
function qaNudge(){
 const q=state.quotes.find(function(x){return x.id===openQuoteId});if(!q)return;
 const v=VEHICLES.find(function(x){return q.cfg&&x.id===q.cfg.vehicle});
 const t='Hi '+(q.name||'there')+' 👋 just floating your quote back up — still £'+fmtN(q.total)+' all-in for your '+(v?v.pron:'car')+'. Want me to hold a slot? Happy to tweak anything 😊';
 q.nudges=(q.nudges||0)+1;save();renderQuotes();
 nativeShare(t,function(ok){if(!ok)window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank')});
}
function qaWa(){const q=state.quotes.find(function(x){return x.id===openQuoteId});if(q&&q.txt)window.open('https://wa.me/?text='+encodeURIComponent(q.txt),'_blank')}
function qaSms(){const q=state.quotes.find(function(x){return x.id===openQuoteId});if(q&&q.txt)window.open('sms:?&body='+encodeURIComponent(q.txt),'_blank')}
function qaCopy(){const q=state.quotes.find(function(x){return x.id===openQuoteId});if(!q||!q.txt)return;copyText(q.txt,function(){toast('Copied ✓')})}
function qaReuse(){
 safe(function(){
  const q=state.quotes.find(function(x){return x.id===openQuoteId});
  if(!q||!q.cfg){toast('⚠️ Nothing to reuse');return}
  state.vehicle=VEHICLES.some(function(v){return v.id===q.cfg.vehicle})?q.cfg.vehicle:'m';
  state.soil=SOILS.some(function(s){return s.id===q.cfg.soil})?q.cfg.soil:'light';
  const sel=(q.cfg.sel||[]).filter(function(id){return state.services.some(function(s){return s.id===id})});
  state.sel=new Set(sel);
  state.miles=isFinite(+q.cfg.miles)?+q.cfg.miles:0;
  state.cust=q.cfg.name||'';state.note=q.cfg.note||'';
  state.dir=1;state.step=sel.length?4:2;
  closeSheet('qOverlay');nav('quote');
  toast(sel.length?'Loaded — tweak & send ✓':'Loaded — pick the services');
 },'reuse');
}
function qaAdjust(){
 const q=state.quotes.find(function(x){return x.id===openQuoteId});if(!q)return;
 const v=prompt('Final price agreed? (quoted '+fmtN(q.total)+')',fmtN(q.total));if(v===null)return;
 const n=parseFloat(v);if(isNaN(n)||n<0)return toast('⚠️ Enter a valid amount');
 q.total=Math.round(n*100)/100;save();renderQuotes();openQuote(q.id);toast('Price updated ✓');
}
function qaDelete(){
 const q=state.quotes.find(function(x){return x.id===openQuoteId});if(!q)return;
 if(!confirm('Delete this quote?'))return;
 state.quotes=state.quotes.filter(function(x){return x.id!==openQuoteId});
 save();closeSheet('qOverlay');renderQuotes();toast('Deleted');
}
/* ---------- settings ---------- */
function setCfg(k,v){state.cfg[k]=v;save();renderSettingsVals()}
function setNum(k,v){const n=parseFloat(v);if(isNaN(n)||n<0)return;state.cfg[k]=n;save()}
function setPct(v){const n=parseFloat(v);if(isNaN(n))return;state.cfg.depPct=Math.min(100,Math.max(0,n));save()}
function renderSettingsVals(){
 $('#bizVal').textContent=state.cfg.name.trim()||'not set';
 $('#menuVal').textContent=state.services.filter(function(s){return s.enabled}).length+' offered';
 $('#quoteVal').textContent=state.cfg.depOn?('deposit '+state.cfg.depPct+'%'):'no deposit';
 $('#dataVal').textContent=state.cfg.lastBackupAt?new Date(state.cfg.lastBackupAt).toLocaleDateString('en-GB'):'never';
 $('#depChk').checked=state.cfg.depOn;$('#cfgPct').value=state.cfg.depPct;
 $('#scarcityChk').checked=state.cfg.scarcity;$('#cfgScarcity').value=state.cfg.scarcityText;
 $('#cfgFree').value=state.cfg.freeMi;$('#cfgRate').value=state.cfg.rate;$('#cfgName').value=state.cfg.name;
}
function dismissOnb(){try{localStorage.setItem('sq_onb','1')}catch(e){};renderStep(false)}
function gotoBiz(){dismissOnb();nav('settings');document.getElementById('acc-biz').classList.add('open');$('#cfgName').focus()}
function accToggle(h){h.parentElement.classList.toggle('open');buzz()}
function renderMenu(){
 $('#menuList').innerHTML=state.services.map(function(s,i){
  const meta=(s.enabled?TYPE_LABEL[s.type]:'hidden')+' · '+fmtM(s.mins);
  return '<div class="mrow'+(s.enabled?'':' off')+'" onclick="openSvc(\''+s.id+'\')">'
   +'<span class="si">'+ic(s.icon,24)+'</span>'
   +'<span class="mn"><b>'+esc(s.name)+'</b><i>'+meta+'</i></span>'
   +'<span class="mp">£'+fmtN(s.base)+'</span>'
   +'<label class="sw" onclick="event.stopPropagation()"><input type="checkbox" aria-label="Offer '+esc(s.name)+'"'+(s.enabled?' checked':'')+' onchange="svcToggle(\''+s.id+'\',this.checked)"><i></i></label>'
   +'<span class="mv"><button class="mvb" onclick="event.stopPropagation();moveSvc(\''+s.id+'\',-1)"'+(i===0?' disabled':'')+'>▲</button>'
   +'<button class="mvb" onclick="event.stopPropagation();moveSvc(\''+s.id+'\',1)"'+(i===state.services.length-1?' disabled':'')+'>▼</button></span></div>';
 }).join('')||'<p class="empty">No services yet</p>';
 renderSettingsVals();
}
function moveSvc(id,dir){
 const i=state.services.findIndex(function(x){return x.id===id}),j=i+dir;
 if(i<0||j<0||j>=state.services.length)return;
 const a=state.services,tmp=a[i];a[i]=a[j];a[j]=tmp;
 save();renderMenu();buzz();
}
function svcToggle(id,v){const s=state.services.find(function(x){return x.id===id});if(!s)return;s.enabled=v;state.sel.delete(id);save();renderMenu();buzz()}
function openSheet(id){$('#'+id).hidden=false;document.body.style.overflow='hidden'}
function closeSheet(id){$('#'+id).hidden=true;document.body.style.overflow=''}
function renderEmojiRow(cur){$('#emojiRow').innerHTML=EMOJIS.map(function(e){return '<button class="eb'+(e===cur?' on':'')+'" onclick="pickEmoji(\''+e+'\')">'+ic(e,20)+'</button>'}).join('')}
function pickEmoji(e){$('#fIcon').value=e;renderEmojiRow(e)}
function renderTypeSeg(t){
 $('#fType').innerHTML=Object.keys(TYPE_LABEL).map(function(k){return '<button class="'+(k===t?'on':'')+'" onclick="setModalType(\''+k+'\')">'+(k==='addon'?'Fixed price':'Condition applies')+'</button>'}).join('');
 $('#typeHint').textContent=TYPE_HINT[t];
}
function setModalType(t){modalType=t;renderTypeSeg(t)}
function openSvc(id){
 const s=state.services.find(function(x){return x.id===id});if(!s)return;
 editId=id;modalType=s.type;
 $('#svcTitle').textContent='Edit service';
 $('#fName').value=s.name;$('#fBase').value=s.base;$('#fMins').value=s.mins;$('#fDesc').value=s.desc||'';
 $('#fIcon').value=s.icon||'sparkles';renderTypeSeg(s.type);renderEmojiRow(s.icon||'sparkles');
 $('#fOn').checked=!!s.enabled;$('#svcDel').style.display='';$('#dupBtn').style.display='';
 openSheet('svcOverlay');buzz();
}
function newSvc(){editId=null;modalType='both';
 $('#svcTitle').textContent='New service';
 $('#fName').value='';$('#fBase').value=30;$('#fMins').value=60;$('#fDesc').value='';
 $('#fIcon').value='sparkles';renderTypeSeg('both');renderEmojiRow('sparkles');
 $('#fOn').checked=true;$('#svcDel').style.display='none';$('#dupBtn').style.display='none';
 openSheet('svcOverlay');
}
function bump(id,d){const el=$('#'+id);let v=(parseFloat(el.value)||0)+d;const min=parseFloat(el.min)||0;if(v<min)v=min;el.value=v}
function saveSvc(){
 const name=$('#fName').value.trim()||'Untitled service';
 const base=parseFloat($('#fBase').value),mins=parseFloat($('#fMins').value);
 if(isNaN(base)||base<0)return toast('⚠️ Price must be a number');
 if(isNaN(mins)||mins<5)return toast('⚠️ Time must be at least 5 mins');
 const iconVal=$('#fIcon').value.trim()||'sparkles',desc=$('#fDesc').value.trim(),soil=modalType!=='addon',enabled=$('#fOn').checked;
 if(editId){
  const s=state.services.find(function(x){return x.id===editId});
  if(!s)return closeSheet('svcOverlay');
  s.name=name;s.base=base;s.mins=mins;s.icon=iconVal;s.desc=desc;s.soil=soil;s.enabled=enabled;s.type=modalType;
  if(!enabled)state.sel.delete(s.id);
 }else state.services.push({id:uid(),name:name,base:base,mins:mins,icon:iconVal,desc:desc,soil:soil,enabled:enabled,type:modalType});
 save();closeSheet('svcOverlay');renderMenu();buzz();toast('Saved ✓');
}
function dupFromModal(){
 if(!editId)return;
 const s=state.services.find(function(x){return x.id===editId});if(!s)return;
 const copy=Object.assign({},s,{id:uid(),name:s.name+' (copy)'});
 state.services.push(copy);save();closeSheet('svcOverlay');renderMenu();openSvc(copy.id);toast('Duplicated ✓');
}
function delFromModal(){
 const s=state.services.find(function(x){return x.id===editId});if(!s)return;
 if(!confirm('Remove "'+s.name+'" from your menu? Past quotes keep their history.'))return;
 state.services=state.services.filter(function(x){return x.id!==editId});state.sel.delete(editId);
 save();closeSheet('svcOverlay');renderMenu();toast('Removed ✓');
}
function resetMenu(){
 if(!confirm('Reset your whole menu to the starter template? Custom services and prices will be lost.'))return;
 state.services=normServices(null);state.sel=new Set();
 save();renderMenu();toast('Menu reset ✓');
}
function sampleQuote(){
 const c=state.cfg,biz=c.name.trim(),total=165.5;
 let out='Hi Sarah 👋\n\nThanks for reaching out — here\'s your quote for your SUV or 4x4:\n\n• Full Valet (in + out) — £138\n• Pet Hair Removal — £22.50\n• Travel (15 mi) — £5\n\nTime on site: approx 5h\nTOTAL: £'+fmtN(total)+'\n';
 if(c.depOn)out+='\nDeposit to secure your slot: £'+fmtN(depAmt(total))+'\n';
 out+='\nYou\'ll pick it up smelling fresh, with paint that beads water on the drive home 🌧✨\n\nPrice confirmed on inspection — no surprises, ever.\n';
 if(c.scarcity&&c.scarcityText.trim())out+='\n⚡ '+c.scarcityText.trim()+'\n';
 out+='\nReply YES and I\'ll lock your slot in ✅ (quote valid 7 days)\n';
 if(biz)out+='\n— '+biz+'\n';
 out+='Quote made with ShineQuote';return out;
}
function openPrev(){$('#prevBox').textContent=sampleQuote();openSheet('prevOverlay')}
function copySample(){copyText(sampleQuote(),function(){toast('Sample copied ✓')})}
function exportData(){
 state.cfg.lastBackupAt=Date.now();save();
 const blob=new Blob([JSON.stringify({app:'shinequote',v:3,exported:new Date().toISOString(),quotes:state.quotes,services:state.services,cfg:state.cfg},null,2)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='shinequote-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();
 toast('Backup downloaded ✓');renderSettingsVals();
}
function importData(input){
 const f=input.files&&input.files[0];if(!f)return;
 const r=new FileReader();
 r.onload=function(){
  try{
   const d=JSON.parse(r.result);
   if(!d||(!d.quotes&&!d.jobs))throw new Error('bad file');
   if(!confirm('Replace current data with this backup?')){input.value='';return}
   state.quotes=(d.quotes||d.jobs||[]).map(function(q){return{id:q.id||uid(),d:q.d,s:q.s||q.v||'',name:q.name||'',note:q.note||'',lines:q.lines||[],total:isFinite(+q.total)?+q.total:0,status:q.status||'done',txt:q.txt||null,cfg:q.cfg||null,nudges:q.nudges||0}});
   if(d.services&&d.services.length)state.services=normServices(d.services);
   if(d.cfg)Object.assign(state.cfg,d.cfg);
   state.sel=new Set();state.vehicle=null;state.step=0;
   save();renderQuotes();renderMenu();renderSettingsVals();renderStep(true);toast('Backup restored ✓');
  }catch(e){toast('⚠️ Not a valid backup file')}
  input.value='';
 };
 r.readAsText(f);
}
function nav(id){
 curTab=id;
 ['quote','quotes','settings'].forEach(function(s){$('#screen-'+s).hidden=s!==id});
 document.querySelectorAll('.tab').forEach(function(b){b.classList.toggle('on',b.dataset.t===id)});
 window.scrollTo(0,0);
 if(id==='quotes')renderQuotes();
 if(id==='settings'){setTheme('s');renderMenu();renderSettingsVals()}
 if(id==='quote')renderStep(false);
}
let toastTimer;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('show')},1900)}
/* ripple on tap */
document.addEventListener('click',function(e){
 try{
  const t=e.target.closest('.vtile,.orow,.eb,.nextbtn,.primary,.ghost,.textbtn,.go,.tab,.logdone,.fseg button,.seg button');
  if(!t)return;
  const r=document.createElement('span');
  r.className='rip'+(t.classList.contains('on')?' dark':'');
  const rect=t.getBoundingClientRect(),d=Math.max(rect.width,rect.height)*2.2;
  r.style.width=r.style.height=d+'px';
  const x=(e.clientX||rect.left+rect.width/2)-rect.left-d/2;
  const y=(e.clientY||rect.top+rect.height/2)-rect.top-d/2;
  r.style.left=x+'px';r.style.top=y+'px';
  t.appendChild(r);setTimeout(function(){if(r.parentNode)r.parentNode.removeChild(r)},600);
 }catch(err){}
});
/* swipe right = back a step */
(function(){
 let sx=0,sy=0,on=false;
 document.addEventListener('touchstart',function(e){
  if(curTab!=='quote'||state.step===0||state.step===4)return;
  if(e.target.closest('input,textarea'))return;
  sx=e.touches[0].clientX;sy=e.touches[0].clientY;on=true;
 },{passive:true});
 document.addEventListener('touchend',function(e){
  if(!on)return;on=false;
  const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(dx>72&&Math.abs(dy)<48)back();
 },{passive:true});
})();
/* boot */
setIc('brandMark','spark',18);
setIc('tabI1','spark',22);setIc('tabI2','clip',22);setIc('tabI3','gear',22);
setIc('ldIc','plus',16);setIc('plusIc1','plus',16);setIc('eyeIc','eye',16);
setIc('dlIc','down',16);setIc('ulIc','up',16);
setIc('dupIcS','dup',15);setIc('delIcS','trash',15);setIc('cpyIcS','copy',16);
(function(){try{const fx=document.getElementById('bgfx');for(let i=0;i<7;i++){const d=document.createElement('span');d.style.left=(6+Math.random()*88)+'%';const dur=15+Math.random()*15;d.style.animationDuration=dur+'s';d.style.animationDelay=(-Math.random()*dur)+'s';const s=3+Math.random()*4;d.style.width=d.style.height=s+'px';fx.appendChild(d)}}catch(e){}})();
safe(load,'load');
safe(renderQuotes,'quotes');
safe(renderMenu,'menu');
safe(renderSettingsVals,'cfg');
safe(function(){nav('quote')},'boot');
if(document.querySelector('#stepHost .q')){window.__sqBooted=true}
else{safe(fallbackStep,'fallback')}
setTimeout(function(){try{const h=document.getElementById('stepHost');if(h&&!h.innerHTML.trim()){bootFail('The app did not render.');fallbackStep()}}catch(e){}},800);
document.addEventListener('keydown',function(e){if(e.key==='Escape'){closeSheet('svcOverlay');closeSheet('qOverlay');closeSheet('prevOverlay')}});
window.addEventListener('resize',fitBottom);
if('serviceWorker' in navigator && location.protocol.startsWith('http')){navigator.serviceWorker.register('sw.js')}
</script>
